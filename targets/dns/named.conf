# SECURITY-REVIEWED: 2026-07-09 | RULES: v2.6.0-draft
# bind9 DNS config for benchmark target range
# *.target.bench → 172.20.0.2 (nginx gateway)

options {
    directory "/var/cache/bind";
    listen-on { 172.20.0.53; };
    allow-query { any; };
    recursion no;
};

zone "target.bench" {
    type master;
    file "/etc/bind/db.target.bench";
};
