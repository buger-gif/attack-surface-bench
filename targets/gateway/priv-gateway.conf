# priv-gateway: Private-facing nginx — admin + api + internal
# v5.0: Host collision target; default_server returns 444 for unknown Host

events { worker_connections 1024; }

http {
    server_tokens on;
    underscores_in_headers on;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Credentials "true" always;
    # 透传后端 X-Internal-Api 线索头 (http级 add_header 会抑制非标准头透传)
    add_header X-Internal-Api $upstream_http_x_internal_api always;

    # admin.target.bench → admin-panel (正常管理入口, 需认证)
    server {
        listen 80;
        server_name admin.target.bench;

        # 功能区: 运营报告
        location /reports { proxy_pass http://172.20.0.11:5000; proxy_set_header Host $host; }
        location /reports/ { proxy_pass http://172.20.0.11:5000; proxy_set_header Host $host; }
        # 功能区: HR 人事管理
        location /hr { proxy_pass http://172.20.0.11:5000; proxy_set_header Host $host; }
        location /hr/ { proxy_pass http://172.20.0.11:5000; proxy_set_header Host $host; }
        # 默认路由 → admin-panel
        location / { proxy_pass http://172.20.0.11:5000; proxy_set_header Host $host; }
        # 信息泄露: /backup/ autoindex
        location /backup/ { alias /var/backups/; autoindex on; }
    }

    # api.target.bench → 同服务多入口权限绕过核心
    server {
        listen 80;
        server_name api.target.bench;

        # 漏洞 ME1: /api/internal/ → admin-panel 无认证
        location /api/internal/ { proxy_pass http://172.20.0.11:5000/api/internal/; proxy_set_header Host $host; }
        # 漏洞 ME2: /admin/ → admin-panel 根
        location /admin/ { proxy_pass http://172.20.0.11:5000/; proxy_set_header Host $host; }
        # 漏洞 ME3: /system/ → admin-panel 系统接口
        location /system/ { proxy_pass http://172.20.0.11:5000/api/system/; proxy_set_header Host $host; }
        # 正常路由 → modern-app
        location /api/ { proxy_pass http://172.20.0.10:3000/api/; proxy_set_header Host $host; }
        location / { proxy_pass http://172.20.0.10:3000/; proxy_set_header Host $host; }
    }

    # internal.target.bench → 信息泄露
    server {
        listen 80;
        server_name internal.target.bench;

        # 功能区: 监控面板
        location /api/monitor { proxy_pass http://172.20.0.13:5000; proxy_set_header Host $host; }
        location /api/monitor/ { proxy_pass http://172.20.0.13:5000; proxy_set_header Host $host; }
        # 功能区: 部署管理
        location /api/deploy { proxy_pass http://172.20.0.13:5000; proxy_set_header Host $host; }
        location /api/deploy/ { proxy_pass http://172.20.0.13:5000; proxy_set_header Host $host; }
        # 默认路由 → internal-tools
        location / { proxy_pass http://172.20.0.13:5000; proxy_set_header Host $host; }
    }

    # 未知 Host → 关闭连接 (让 Host 碰撞有区分度)
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}
