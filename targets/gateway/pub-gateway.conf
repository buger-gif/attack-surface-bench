# pub-gateway: Public-facing nginx — www + shop only
# v5.0: No localhost catch-all; default_server returns 444 for unknown Host

events { worker_connections 1024; }

http {
    server_tokens on;
    underscores_in_headers on;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Credentials "true" always;
    # 透传后端 X-Internal-Api 线索头 (http级 add_header 会抑制非标准头透传)
    add_header X-Internal-Api $upstream_http_x_internal_api always;

    # www.target.bench → modern-app
    server {
        listen 80;
        server_name www.target.bench;

        # 功能区: 电商购物
        location /shop { proxy_pass http://172.20.0.10:3000; proxy_set_header Host $host; }
        location /shop/ { proxy_pass http://172.20.0.10:3000; proxy_set_header Host $host; }
        # 功能区: 社区论坛
        location /community { proxy_pass http://172.20.0.10:3000; proxy_set_header Host $host; }
        location /community/ { proxy_pass http://172.20.0.10:3000; proxy_set_header Host $host; }
        # 功能区: 客服工单
        location /support { proxy_pass http://172.20.0.10:3000; proxy_set_header Host $host; }
        location /support/ { proxy_pass http://172.20.0.10:3000; proxy_set_header Host $host; }
        # 根路径 → 302 /shop
        location = / { return 302 /shop; }
        # 其他路径 → modern-app (API, GraphQL 等)
        location / { proxy_pass http://172.20.0.10:3000; proxy_set_header Host $host; }
    }

    # shop.target.bench → bff-gateway
    server {
        listen 80;
        server_name shop.target.bench;

        # 正常 BFF 路由
        location /api/ { proxy_pass http://172.20.0.12:5000/api/; proxy_set_header Host $host; }
        # 漏洞: /sysadmin/ → BFF 代理到 admin-panel
        location /sysadmin/ { proxy_pass http://172.20.0.12:5000/sysadmin/; proxy_set_header Host $host; }
        # 漏洞: /debug/admin → admin-panel 调试信息 (直连 admin-panel IP)
        location /debug/admin { proxy_pass http://172.20.0.11:5000/api/system/status; proxy_set_header Host admin.target.bench; }
        # 默认路由
        location / { proxy_pass http://172.20.0.12:5000/; proxy_set_header Host $host; }
    }

    # 未知 Host → 关闭连接 (让碰撞有区分度)
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}
