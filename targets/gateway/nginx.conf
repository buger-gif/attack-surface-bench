# SECURITY-REVIEWED: 2026-07-09 | RULES: v2.6.0-draft
# Nginx gateway for benchmark target range
# 5 server blocks: www/admin/api/shop/internal with multi-entry bypass routing

events { worker_connections 1024; }

http {
    server_tokens on;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # ===== www.target.com → modern-app =====
    server {
        listen 80;
        server_name www.target.com;
        location / {
            proxy_pass http://172.20.0.10:3000;
            proxy_set_header Host $host;
        }
    }

    # ===== admin.target.com → admin-panel（正常管理入口，需认证） =====
    server {
        listen 80;
        server_name admin.target.com;
        location / {
            proxy_pass http://172.20.0.11:5000;
            proxy_set_header Host $host;
        }
        location /backup/ {
            alias /var/backups/;
            autoindex on;
        }
    }

    # ===== api.target.com → 同服务多入口权限绕过核心 =====
    # admin-panel 服务同时响应 admin.target.com 和 api.target.com
    # 但通过 api.target.com 访问 /api/internal/* 时，不经过 admin 的认证检查
    server {
        listen 80;
        server_name api.target.com;

        # 正常：api.target.com 的现代API路由 → 指向modern-app
        location /api/ {
            proxy_pass http://172.20.0.10:3000/api/;
            proxy_set_header Host $host;
        }

        # 漏洞1: /api/internal/ 指向 admin-panel，无额外认证
        # 同一个 admin-panel 服务，通过 api.target.com 访问时绕过了域名级认证
        location /api/internal/ {
            proxy_pass http://172.20.0.11:5000/api/internal/;
            proxy_set_header Host $host;
            # 没有 auth_basic / JWT验证，直接透传
        }

        # 漏洞2: /admin/ 路径也暴露，直接映射到 admin-panel 根
        location /admin/ {
            proxy_pass http://172.20.0.11:5000/;
            proxy_set_header Host $host;
        }

        # 漏洞3: /system/ 暴露 admin-panel 的系统接口
        location /system/ {
            proxy_pass http://172.20.0.11:5000/api/system/;
            proxy_set_header Host $host;
        }

        # 正常路由
        location / {
            proxy_pass http://172.20.0.10:3000/;
            proxy_set_header Host $host;
        }
    }

    # ===== shop.target.com → BFF数据聚合 + 隐藏端点暴露 =====
    server {
        listen 80;
        server_name shop.target.com;

        # 正常BFF路由
        location /api/ {
            proxy_pass http://172.20.0.12:5000/api/;
            proxy_set_header Host $host;
        }

        # 漏洞4: BFF暴露 /sysadmin/ → BFF代理到admin-panel (带内部认证)
        location /sysadmin/ {
            proxy_pass http://172.20.0.12:5000/sysadmin/;
            proxy_set_header Host $host;
        }

        # 漏洞5: BFF暴露 /debug/admin → admin-panel调试信息
        location /debug/admin {
            proxy_pass http://172.20.0.11:5000/api/system/status;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://172.20.0.12:5000/;
            proxy_set_header Host $host;
        }
    }

    # ===== internal.target.com → 信息泄露 =====
    server {
        listen 80;
        server_name internal.target.com;
        location / {
            proxy_pass http://172.20.0.13:5000;
            proxy_set_header Host $host;
        }
    }
}
