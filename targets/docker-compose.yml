# docker-compose.yml for benchmark target range (10 services on bm-net 172.20.0.0/24)
# v5.0: Dual gateway — pub-gateway(.2) + priv-gateway(.3)

version: '3.8'

services:
  dns:
    image: internetsystemsconsortium/bind9:9.18
    volumes:
      - ./dns/named.conf:/etc/bind/named.conf:ro
      - ./dns/db.target.bench:/etc/bind/db.target.bench:ro
    networks:
      bm-net:
        ipv4_address: 172.20.0.53

  pub-gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/pub-gateway.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      bm-net:
        ipv4_address: 172.20.0.2
    depends_on: [www, admin, shop]

  priv-gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/priv-gateway.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"    # verification port for self-test only; unknown Host → 444
    networks:
      bm-net:
        ipv4_address: 172.20.0.3
    depends_on: [admin, internal]

  # ===== www.target.bench — 现代漏洞基线 =====
  www:
    build: ./services/modern-app
    hostname: www.target.bench
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - JWT_SECRET=dev-jwt-secret-change
      - NODE_ENV=development
      - DEBUG=true
    networks:
      bm-net:
        ipv4_address: 172.20.0.10
    depends_on: [mongodb]

  # ===== admin.target.bench — 隐藏参数后门核心 =====
  admin:
    build: ./services/admin-panel
    hostname: admin.target.bench
    environment:
      - DB_HOST=db
      - DB_USER=appuser
      - DB_PASSWORD=apppass123
      - DB_NAME=app_db
      - JWT_SECRET=dev-secret-change-me
      - ADMIN_PASSWORD=admin123
      - DEBUG=True
    networks:
      bm-net:
        ipv4_address: 172.20.0.11
    depends_on: [db]

  # ===== api.target.bench — 同服务多入口（指向admin-panel内部路由） =====
  # 注意：api.target.bench 不是独立服务，由 priv-gateway 路由到 admin-panel
  # 详见 gateway/priv-gateway.conf — Host 碰撞发现

  # ===== shop.target.bench — BFF数据聚合 =====
  shop:
    build: ./services/bff-gateway
    hostname: shop.target.bench
    environment:
      - ADMIN_SERVICE_URL=http://172.20.0.11:5000
      - USER_SERVICE_URL=http://172.20.0.10:3000
      - INTERNAL_KEY=sk-app-internal
    networks:
      bm-net:
        ipv4_address: 172.20.0.12

  # ===== internal.target.bench — 信息泄露 =====
  internal:
    build: ./services/internal-tools
    hostname: internal.target.bench
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - NO_AUTH=true
    networks:
      bm-net:
        ipv4_address: 172.20.0.13
    depends_on: [db, redis]

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: app_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    networks:
      bm-net:
        ipv4_address: 172.20.0.20
    ports:
      - "13306:3306"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    networks:
      bm-net:
        ipv4_address: 172.20.0.21
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:6-jammy
    networks:
      bm-net:
        ipv4_address: 172.20.0.22
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: modern_app

  # ===== Spring Boot 微服务 — 路径规范化差异绕过目标 =====

  user-service:
    build: ./services/spring-boot-service
    hostname: user-service
    environment:
      - DB_URL=jdbc:mysql://user-db.internal:3306/user_db
      - DB_USERNAME=user_service_app
      - DB_PASSWORD=Us3rS3rv1ce#2024!
      - JWT_SECRET=eyJhbGciOiJIUzI1NiJ9.user-service-jwt-secret-key-2024
      - REDIS_HOST=redis-user.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=RedisUser#2024!Secure
    networks:
      bm-net:
        ipv4_address: 172.20.0.30

  order-service:
    build: ./services/spring-boot-service
    hostname: order-service
    environment:
      - DB_URL=jdbc:mysql://order-db.internal:3306/order_db
      - DB_USERNAME=order_service_app
      - DB_PASSWORD=0rd3rS3rv1ce#2024!
      - MQ_URL=amqp://mq.internal:5672
      - MQ_USERNAME=order_mq_user
      - MQ_PASSWORD=RabbitMQ#Order#2024!Secret
    networks:
      bm-net:
        ipv4_address: 172.20.0.31

  payment-service:
    build: ./services/spring-boot-service
    hostname: payment-service
    environment:
      - DB_URL=jdbc:mysql://payment-db.internal:3306/payment_db
      - DB_USERNAME=payment_service_app
      - DB_PASSWORD=P@ym3ntS3rv1ce#2024!
      - STRIPE_API_KEY=sk_live_FAKE_BENCH_TARGET_51H9xKjL4dF3kP8mN7qR2sT5vW1yA6bC9eD0fG3hI4jK
      - STRIPE_WEBHOOK_SECRET=whsec_FAKE_BENCH_8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d
      - ALIPAY_APP_ID=FAKE_BENCH_2021001234567890
      - ALIPAY_PRIVATE_KEY=FAKE_BENCH_RSA_PRIVATE_KEY_FOR_TARGET_TESTING_ONLY
      - ALIPAY_PUBLIC_KEY=FAKE_BENCH_RSA_PUBLIC_KEY_FOR_TARGET_TESTING_ONLY
      - WECHAT_PAY_MCH_ID=FAKE_BENCH_1234567890
      - WECHAT_PAY_API_KEY=FAKE_BENCH_WeChatPayApiKey2024SecretKey!!
      - WECHAT_PAY_API_V3_KEY=FAKE_BENCH_WeChatPayApiV3Key2024VerySecret
    networks:
      bm-net:
        ipv4_address: 172.20.0.32

networks:
  bm-net:
    ipam:
      config:
        - subnet: 172.20.0.0/24
