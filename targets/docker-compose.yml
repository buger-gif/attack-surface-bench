# SECURITY-REVIEWED: 2026-07-09 | RULES: v2.6.0-draft
# docker-compose.yml for benchmark target range (9 services on bm-net 172.20.0.0/24)

version: '3.8'

services:
  dns:
    image: internetsystemsconsortium/bind9:9.18
    volumes:
      - ./dns/named.conf:/etc/bind/named.conf:ro
      - ./dns/db.target.com:/etc/bind/db.target.com:ro
    networks:
      bm-net:
        ipv4_address: 172.20.0.53

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    networks:
      bm-net:
        ipv4_address: 172.20.0.2
    depends_on: [www, admin, shop, internal]

  # ===== www.target.com — 现代漏洞基线 =====
  www:
    build: ./services/modern-app
    hostname: www.target.com
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - JWT_SECRET=dev-jwt-secret-change
      - NODE_ENV=development
      - DEBUG=true
    networks:
      bm-net:
        ipv4_address: 172.20.0.10
    depends_on: [mongodb]

  # ===== admin.target.com — 隐藏参数后门核心 =====
  admin:
    build: ./services/admin-panel
    hostname: admin.target.com
    environment:
      - DB_HOST=db
      - JWT_SECRET=dev-secret-change-me
      - ADMIN_PASSWORD=admin123
      - DEBUG=True
    networks:
      bm-net:
        ipv4_address: 172.20.0.11
    depends_on: [db]

  # ===== api.target.com — 同服务多入口（指向admin-panel内部路由） =====
  # 注意：api.target.com 不是独立服务，由gateway路由到admin-panel
  # 详见 gateway/nginx.conf

  # ===== shop.target.com — BFF数据聚合 =====
  shop:
    build: ./services/bff-gateway
    hostname: shop.target.com
    environment:
      - ADMIN_SERVICE_URL=http://172.20.0.11:5000
      - USER_SERVICE_URL=http://172.20.0.10:3000
      - INTERNAL_KEY=sk-app-internal
    networks:
      bm-net:
        ipv4_address: 172.20.0.12

  # ===== internal.target.com — 信息泄露 =====
  internal:
    build: ./services/internal-tools
    hostname: internal.target.com
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - NO_AUTH=true
    networks:
      bm-net:
        ipv4_address: 172.20.0.13
    depends_on: [db, redis]

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: app_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    networks:
      bm-net:
        ipv4_address: 172.20.0.20
    ports:
      - "13306:3306"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    networks:
      bm-net:
        ipv4_address: 172.20.0.21
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:6-jammy
    networks:
      bm-net:
        ipv4_address: 172.20.0.22
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: modern_app

networks:
  bm-net:
    ipam:
      config:
        - subnet: 172.20.0.0/24
